<script type="text/html" id="projects-panel-template">
  <menu>
    <div class="filters-panel cf">
      <label class="filter-label" for="project">Filter by last updated:</label>
      <div class="radio-btn-row">
        <div class="radio-btn-wrapper">
          <button id="1week" class="radio-btn" type="button">1 Week</button>
        </div>
        <div class="radio-btn-wrapper">
          <button id="1month" class="radio-btn" type="button">1 Month</button>
        </div>
        <div class="radio-btn-wrapper">
          <button id="6months" class="radio-btn" type="button">6 Months</button>
        </div>
        <div class="radio-btn-wrapper">
          <button id="1year" class="radio-btn" type="button">1 Year</button>
        </div>
        <div class="radio-btn-wrapper">
          <button id="2years" class="radio-btn" type="button">2 Years</button>
        </div>
      </div>
    </div>

    <div class="filters-panel cf">
      <label class="filter-label" for="project">Filter by name:</label>
      <select
        class="names-filter"
        id="project"
        multiple
        data-placeholder="Select a project..."
      >
        <% _.each(names, function(entry, key){ %>
        <option value="<%-key%>"><%- entry.name%></option>
        <% }) %>
      </select>
    </div>
    <div class="filters-panel cf">
      <label class="filter-label" for="label">Filter by label: </label>
      <select
        class="labels-filter"
        id="label"
        multiple
        data-placeholder="Select a label..."
      >
        <% _.each(labels, function(entry, key){ %>
        <option value="<%-key%>"><%- entry.name%></option>
        <% }) %>
      </select>
    </div>
    <div class="filters-panel cf">
      <label class="filter-label" for="tag">Filter by tags: </label>
      <select
        class="tags-filter"
        id="tag"
        multiple
        data-placeholder="Select a tag..."
      >
        <% _.each(tags, function(entry, key){ %>
        <option value="<%-entry.name%>">
          <%- entry.name%> (<%-entry.frequency%>)
        </option>
        <% }) %>
      </select>
    </div>
    <div class="filters-panel cf">
      <label class="filter-label">Popular tags:</label>
      <ul class="popular-tags">
        <% _.each(popularTags, function(entry, key){ %>
        <li>
          <a title="Popular Tag: <%-entry.name%>" tabindex="0"
            ><%-entry.name%>
            <span class="popular-tags__frequency"
              >(<%-entry.frequency%>)</span
            ></a
          >
        </li>
        <% }) %>
      </ul>
    </div>
  </menu>
  <div class="projects">
    <% let count=0 %> <% _.each(projects, function(project) { %> <%
    count=count+1%>
    <div class="data-box" class="<% if ( project.stats ) { %>counted<% } %>">
      <div>
        <div>
          <div colspan="2" class="title">
            <span class="proj"
              ><a href="<%-project.site %>" target="_blank"
                ><%-project.name %></a
              ></span
            >
          </div>
        </div>
        <div>
          <div class="details stats">
            <p class="label">
              <a
                href="<%- project.upforgrabs.link %>"
                title="View open issues for <%-project.name %>"
                target="_blank"
                tabindex="-1"
              >
                <%-project.upforgrabs.name %> <% if (project.stats &&
                project.stats['last-updated']) { const now=new Date(); let
                lastUpdated=new Date(project.stats['last-updated']); let
                since=relativeTime(now, lastUpdated); %>
                <span class="count" title="Last updated <%- since %>"
                  ><%-project.stats['issue-count']%></span
                >
                <% } else if (project.stats) { %>
                <span class="count" title="No recent activity"
                  ><%-project.stats['issue-count']%></span
                >
                <% } %>
              </a>
            </p>
            <% if (project.stats) { %>
            <div class="fork-count" title="Number of forks">
              <svg
                aria-hidden="true"
                height="16"
                viewBox="0 0 16 16"
                version="1.1"
                width="16"
                data-view-component="true"
                class="fork-count-svg"
              >
                <path
                  d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"
                ></path>
              </svg>
              <%-project.stats['fork-count']%>
              <span class="tooltip">Forks</span>
            </div>
            <% } %>
          </div>
          <div class="details">
            <% if (project.desc) { %>
            <span class="desc"> <%=project.desc%> </span>
            <% } %>
          </div>
        </div>
      </div>
      <div class="details-tags">
        <% if (project.tags) { %>
        <ul class="tags" aria-label="project tags">
          <% _.each(project.tags, function(tag, i) { %>
          <li>
            <a href="#/filters?tags=<%-encodeURIComponent(tag)%>" tabindex="-1"
              ><%-tag%></a
            >
          </li>
          <% }) %>
        </ul>
        <% } %>
      </div>
    </div>
    <% }) %>
  </div>

  <!-- Pagination Controls -->
  <% if (pagination && pagination.totalItems > 0 && pagination.totalPages > 1) {
  // Helper function to build filter parameters var buildFilterParams =
  function() { var params = ''; if (selectedTags && selectedTags.length > 0) {
  params += '&tags=' + encodeURIComponent(selectedTags.join(',')); } if
  (selectedNames && selectedNames.length > 0) { params += '&names=' +
  encodeURIComponent(selectedNames.join(',')); } if (selectedLabels &&
  selectedLabels.length > 0) { params += '&labels=' +
  encodeURIComponent(selectedLabels.join(',')); } return params; }; %>
  <div class="pagination-container">
    <div class="pagination-info">
      Showing <%= pagination.startItem %>-<%= pagination.endItem %> of <%=
      pagination.totalItems %> projects
    </div>

    <div class="pagination-controls">
      <!-- Previous Button -->
      <% if (pagination.hasPrevious) { %>
      <a
        href="#/filters?page=<%= pagination.currentPage - 1 %><%= buildFilterParams() %>"
        class="pagination-btn pagination-prev"
        aria-label="Previous page"
      >
        ← Previous
      </a>
      <% } else { %>
      <span class="pagination-btn pagination-prev disabled" aria-disabled="true"
        >← Previous</span
      >
      <% } %>

      <!-- Page Numbers -->
      <div class="pagination-pages">
        <% // Show max 5 page numbers with current page in middle when possible
        var startPage = Math.max(1, pagination.currentPage - 2); var endPage =
        Math.min(pagination.totalPages, startPage + 4); // Adjust if we're near
        the end if (endPage - startPage < 4) { startPage = Math.max(1, endPage -
        4); } // First page + ellipsis if needed if (startPage > 1) { %>
        <a
          href="#/filters?page=1<%= buildFilterParams() %>"
          class="pagination-page"
          aria-label="Page 1"
          >1</a
        >
        <% if (startPage > 2) { %>
        <span class="pagination-ellipsis">...</span>
        <% } %> <% } %>

        <!-- Page number range -->
        <% for (var i = startPage; i <= endPage; i++) { %> <% if (i ===
        pagination.currentPage) { %>
        <span
          class="pagination-page active"
          aria-current="page"
          aria-label="Current page, page <%= i %>"
          ><%= i %></span
        >
        <% } else { %>
        <a
          href="#/filters?page=<%= i %><%= buildFilterParams() %>"
          class="pagination-page"
          aria-label="Page <%= i %>"
          ><%= i %></a
        >
        <% } %> <% } %>

        <!-- Ellipsis + last page if needed -->
        <% if (endPage < pagination.totalPages) { %> <% if (endPage <
        pagination.totalPages - 1) { %>
        <span class="pagination-ellipsis">...</span>
        <% } %>
        <a
          href="#/filters?page=<%= pagination.totalPages %><%= buildFilterParams() %>"
          class="pagination-page"
          aria-label="Page <%= pagination.totalPages %>"
          ><%= pagination.totalPages %></a
        >
        <% } %>
      </div>

      <!-- Next Button -->
      <% if (pagination.hasNext) { %>
      <a
        href="#/filters?page=<%= pagination.currentPage + 1 %><%= buildFilterParams() %>"
        class="pagination-btn pagination-next"
        aria-label="Next page"
      >
        Next →
      </a>
      <% } else { %>
      <span class="pagination-btn pagination-next disabled" aria-disabled="true"
        >Next →</span
      >
      <% } %>
    </div>
  </div>
  <% } %> <% if(count==0) { %>
  <p style="font-size: 1.5em;font-weight: 600;line-height: 30px;">
    No projects found with this description...
  </p>
  <% } %>
</script>
<script
  src="{{ site.github.url }}javascripts/lib/require.js"
  data-main="javascripts/app"
></script>

    i['GoogleAnalyticsObject'] = r;
    ((i[r] =
      i[r] ||
      function () {
        (i[r].q = i[r].q || []).push(arguments);
      }),
      (i[r].l = 1 * new Date()));
    ((a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]));
    a.async = 1;

    m.parentNode.insertBefore(a, m);
  })(
