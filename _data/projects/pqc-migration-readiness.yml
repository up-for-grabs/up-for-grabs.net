name: PQC Migration Readiness
desc: >-
  A static auditor that estimates how much work a post-quantum cryptography
  migration will take for a Java codebase. It finds quantum-vulnerable JCA usage
  and structural fragility, ranks the hotspots, and produces an ordered migration
  plan with an engineer-time estimate, as JSON, Markdown, and SARIF.
