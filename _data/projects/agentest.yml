name: AiEnsured agentest
desc: >-
  AiEnsured agentest is an Agentic AI Testing platform. It checks what an AI agent actually did, not only
  what it said, by reading recorded OpenTelemetry traces. The checks are deterministic and run offline
  (pass, fail or n/a, with no model calls and no API keys). Each check is a small Python rule with a passing
  and a failing example trace, so a first contribution is often one rule or one fixture.
