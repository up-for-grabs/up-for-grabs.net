name: GLAFIRA AI Hub
desc: >-
  An open-source personal AI platform connecting Android and Windows around an owner-controlled assistant.
  GLAFIRA is being built to coordinate tasks across devices, integrate multiple AI providers, and provide
  reliable local memory, secure device pairing, and recoverable personal data. We welcome contributors
  interested in Kotlin, Android, Windows, distributed systems, AI integrations, databases, and security.
  Small, well-scoped contributions are available, with maintainers ready to review pull requests and help
  new contributors get started.
